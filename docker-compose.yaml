version: '3.8'

services:
  db:
    image: postgres:9.4
    environment:
      POSTGRES_DB: eval360_development
      POSTGRES_USER: eval360
      POSTGRES_PASSWORD: password
    volumes:
      - ./db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval360 -h db -p 5432 -d eval360_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./
      dockerfile: Dockerfile
    command: bundle exec thin start # --ssl
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
